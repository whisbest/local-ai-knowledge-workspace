name: lkq-multiuser-dev
services:
  db:
    image: postgres:17-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: workspace
      POSTGRES_DB: workspace
      POSTGRES_PASSWORD: ${MULTIUSER_DB_PASSWORD:?Prepare development configuration first}
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - multiuser_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U workspace -d workspace"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  multiuser_dev_pg:
